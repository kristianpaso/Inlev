[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[headers]]
  for = "/bigplus"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/bigplus/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/annotation/sam2"
  to = "/.netlify/functions/sam2"
  status = 200
  force = true

[[redirects]]
  from = "/api/measurement/depth"
  to = "/.netlify/functions/depth"
  status = 200
  force = true
