<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BeteKnepet Admin</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#f3fbff;color:#08303a;}
    header{padding:16px 18px;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);position:sticky;top:0;}
    .wrap{max-width:1050px;margin:0 auto;padding:16px;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);background:#fff;cursor:pointer;font-weight:800;}
    .btn.primary{background:#11b78d;border-color:#11b78d;color:#fff;}
    .msg{margin-top:10px;font-weight:800;}
    .msg.ok{color:#0aa373} .msg.err{color:#d14b4b}
    .input{padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.14);width:100%;}
    .wTitle{max-width:520px} .wKey{max-width:280px} .wOrder{max-width:110px}
    .steps{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
    .step{border:1px solid rgba(0,0,0,.10);border-radius:16px;overflow:hidden;background:#fff;}
    .stepTop{padding:12px;background:#f7fbff;border-bottom:1px solid rgba(0,0,0,.06);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;}
    .opt{border:1px solid rgba(0,0,0,.10);border-radius:14px;padding:10px;background:#fff;}
    .opt .row{margin-bottom:8px;}
    .preview{height:120px;border-radius:12px;border:1px solid rgba(0,0,0,.08);background:#f3f3f3;background-size:cover;background-position:center;}
    .tag{padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.8);font-weight:900;}
    @media (max-width:800px){.opts{grid-template-columns:1fr;}}
    small{opacity:.7;}
  </style>
</head>
<body>
<header><div class="wrap">
  <div class="row" style="justify-content:space-between;">
    <div>
      <div style="font-weight:900;font-size:18px;">BeteKnepet Admin</div>
      <small>Redigera steg som frontend visar. Sparas i MongoDB collection <b>steg</b>.</small>
    </div>
    <div class="row">
      <span id="status" class="tag">—</span>
      <button class="btn" id="btnLoad">Hämta</button>
      <button class="btn primary" id="btnSave">Spara</button>
      <button class="btn" id="btnAddStep">Lägg till steg</button>
    </div>
  </div>

  <div class="row" style="margin-top:10px;">
    <div style="min-width:220px;">
      <label style="font-weight:800;font-size:12px;opacity:.7;">Server</label>
      <select id="preset" class="input">
        <option value="local">Localhost</option>
        <option value="render">Render</option>
      </select>
    </div>
    <div style="flex:1; min-width:260px;">
      <label style="font-weight:800;font-size:12px;opacity:.7;">API-base</label>
      <input id="base" class="input" placeholder="http://localhost:5005"/>
    </div>
  </div>

  <div id="msg" class="msg"></div>
</div></header>

<div class="wrap">
  <div id="steps" class="steps"></div>
</div>

<script>
(function(){
  const PRESETS = { local: "http://localhost:5005", render: "https://beteknepet-api.onrender.com" };
  const el=(id)=>document.getElementById(id);
  const stepsWrap=el("steps");
  const msg=el("msg");
  const status=el("status");

  function setMsg(t,k){ msg.textContent=t||""; msg.className="msg "+(k||""); }
  function setStatus(text, ok){
    status.textContent = text;
    status.style.borderColor = ok ? "rgba(9,164,120,.35)" : "rgba(210,80,80,.35)";
    status.style.background = ok ? "rgba(9,164,120,.14)" : "rgba(210,80,80,.12)";
  }

  function autoDefaultPreset(){
    // on 8888 we still want default local for convenience
    return "local";
  }

  function loadSaved(){
    const savedPreset = localStorage.getItem("BK_ADMIN_PRESET");
    const savedBase = localStorage.getItem("BK_ADMIN_BASE");
    const preset = (savedPreset && PRESETS[savedPreset]) ? savedPreset : autoDefaultPreset();
    el("preset").value = preset;
    el("base").value = savedBase || PRESETS[preset];
    localStorage.setItem("BK_ADMIN_PRESET", preset);
    localStorage.setItem("BK_ADMIN_BASE", el("base").value.trim());
  }

  function apiBase(){
    const v = (el("base").value||"").trim().replace(/\/$/,"");
    localStorage.setItem("BK_ADMIN_BASE", v);
    return v;
  }

  async function ping(){
    try{
      const r = await fetch(apiBase()+"/health", { cache:"no-store" });
      setStatus(r.ok ? "Ansluten" : "Offline", r.ok);
    }catch(e){ setStatus("Offline", false); }
  }

  async function fetchJson(url, opts){
    const r = await fetch(url, opts);
    const j = await r.json().catch(()=> ({}));
    if(!r.ok) throw new Error(j.error || r.statusText);
    return j;
  }

  let model={steg:[]};
  function uid(p){ return (p||"steg")+"_"+Math.random().toString(16).slice(2,10); }

  function normalize(){
    model.steg=(model.steg||[]).map((s,i)=>({
      id:s.id||uid("steg"), title:s.title||"Nytt steg", key:s.key||uid("key"),
      order: typeof s.order==="number"?s.order:(i+1),
      options:Array.isArray(s.options)?s.options:[]
    })).sort((a,b)=>(a.order||0)-(b.order||0));
    model.steg.forEach(s=>{ s.options=(s.options||[]).map(o=>({value:o.value||"",label:o.label||"",img:o.img||""})); });
  }

  function readFileAsDataURL(file){
    return new Promise((res,rej)=>{
      const fr=new FileReader();
      fr.onload=()=>res(String(fr.result||""));
      fr.onerror=rej;
      fr.readAsDataURL(file);
    });
  }

  function render(){
    normalize();
    stepsWrap.innerHTML="";
    model.steg.forEach((step)=>{
      const box=document.createElement("div"); box.className="step";
      const top=document.createElement("div"); top.className="stepTop";

      const title=document.createElement("input"); title.className="input wTitle";
      title.placeholder="Rubrik (t.ex. Vart fiskar du?)"; title.value=step.title;
      title.oninput=()=>step.title=title.value;

      const key=document.createElement("input"); key.className="input wKey";
      key.placeholder="key (t.ex. platform)"; key.value=step.key;
      key.oninput=()=>step.key=key.value;

      const order=document.createElement("input"); order.className="input wOrder"; order.type="number"; order.value=step.order;
      order.oninput=()=>{ step.order=Number(order.value||0); render(); };

      const addOpt=document.createElement("button"); addOpt.className="btn"; addOpt.textContent="Lägg till svar";
      addOpt.onclick=()=>{ step.options.push({value:"",label:"",img:""}); render(); };

      const del=document.createElement("button"); del.className="btn"; del.textContent="Ta bort";
      del.onclick=()=>{ model.steg=model.steg.filter(x=>x!==step); render(); };

      top.appendChild(title); top.appendChild(key); top.appendChild(order); top.appendChild(addOpt); top.appendChild(del);
      box.appendChild(top);

      const opts=document.createElement("div"); opts.className="opts";
      step.options.forEach((opt)=>{
        const oc=document.createElement("div"); oc.className="opt";
        const r1=document.createElement("div"); r1.className="row";

        const v=document.createElement("input"); v.className="input"; v.placeholder="value (t.ex. bat)"; v.value=opt.value;
        v.oninput=()=>opt.value=v.value;

        const l=document.createElement("input"); l.className="input"; l.placeholder="Rubrik (t.ex. Från Båt)"; l.value=opt.label;
        l.oninput=()=>opt.label=l.value;

        r1.appendChild(v); r1.appendChild(l);

        const r2=document.createElement("div"); r2.className="row";
        const file=document.createElement("input"); file.type="file"; file.accept="image/*";
        const clear=document.createElement("button"); clear.className="btn"; clear.textContent="Ta bort bild";
        const delOpt=document.createElement("button"); delOpt.className="btn"; delOpt.textContent="X";
        const prev=document.createElement("div"); prev.className="preview"; if(opt.img) prev.style.backgroundImage="url('"+opt.img+"')";

        file.onchange=async()=>{ if(!file.files||!file.files[0]) return; opt.img=await readFileAsDataURL(file.files[0]); prev.style.backgroundImage="url('"+opt.img+"')"; };
        clear.onclick=()=>{ opt.img=""; prev.style.backgroundImage=""; };
        delOpt.onclick=()=>{ step.options=step.options.filter(x=>x!==opt); render(); };

        r2.appendChild(file); r2.appendChild(clear); r2.appendChild(delOpt);

        oc.appendChild(r1); oc.appendChild(r2); oc.appendChild(prev);
        opts.appendChild(oc);
      });

      box.appendChild(opts);
      stepsWrap.appendChild(box);
    });
  }

  async function load(){
    setMsg("Hämtar...", "");
    try{
      await ping();
      const j = await fetchJson(apiBase()+"/api/beteknepet/steg", { cache:"no-store" });
      model.steg = j.steg || [];
      render();
      setMsg("Hämtat.", "ok");
    }catch(e){ setMsg("Fel: "+e.message, "err"); }
  }

  async function save(){
    setMsg("Sparar...", "");
    try{
      normalize();
      await ping();
      const j = await fetchJson(apiBase()+"/api/beteknepet/steg", {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ steg: model.steg })
      });
      setMsg("Sparat. Antal: "+(j.count ?? model.steg.length), "ok");
    }catch(e){ setMsg("Fel: "+e.message, "err"); }
  }

  el("btnLoad").onclick = load;
  el("btnSave").onclick = save;
  el("btnAddStep").onclick = ()=>{ model.steg.push({id:uid("steg"),title:"Nytt steg",key:uid("key"),order:model.steg.length+1,options:[]}); render(); };

  el("preset").onchange = ()=>{
    const p = el("preset").value;
    localStorage.setItem("BK_ADMIN_PRESET", p);
    el("base").value = PRESETS[p] || el("base").value;
    localStorage.setItem("BK_ADMIN_BASE", el("base").value.trim());
    load();
  };

  el("base").onchange = ()=>{ localStorage.setItem("BK_ADMIN_BASE", el("base").value.trim()); load(); };

  loadSaved();
  load();
})();
</script>
</body>
</html>
